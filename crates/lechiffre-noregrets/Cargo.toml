[package]
name = "lechiffre-noregrets"
version = "0.1.0"
edition = "2024"
default-run = "lechiffre-noregrets"

[features]
gui = ["dep:ratatui", "dep:crossterm", "dep:tachyonfx", "dep:tempfile", "dep:tracing", "dep:thiserror"]

[dependencies]
noregrets = { package = "pluribus", path = "../../vendor/noregrets" }
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
rs_poker = { path = "../../vendor/rs-poker", default-features = false, features = ["arena", "serde", "open-hand-history"] }
async-trait = "0.1"
tokio = { version = "~1.43", features = ["macros", "rt-multi-thread"] }
ratatui = { version = "~0.30", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "~0.28", features = ["event-stream"], optional = true }
tachyonfx = { version = "~0.25", features = ["std-duration"], optional = true }
tempfile = { version = "~3.27.0", optional = true }
tracing = { version = "~0.1.41", optional = true }
thiserror = { version = "~2.0.12", optional = true }

[[bin]]
name = "lechiffre-arena"
path = "src/bin/lechiffre-arena.rs"
required-features = ["gui"]
test = false

[lints.rust]
unsafe_code = "forbid"
