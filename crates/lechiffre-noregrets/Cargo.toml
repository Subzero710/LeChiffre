[package]
name = "lechiffre-noregrets"
version = "0.1.0"
edition = "2024"

[dependencies]
noregrets = { package = "pluribus", path = "../../vendor/noregrets" }
lechiffre-nlhe = { path = "../lechiffre-nlhe" }
lechiffre-sdcfr = { path = "../lechiffre-sdcfr" }
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
rs_poker = { path = "../../vendor/rs-poker", default-features = false, features = ["arena", "serde"] }
async-trait = "0.1"
tokio = { version = "~1.43", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
